name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder-for-build-only
          META_APP_ID: "123456789"
          META_APP_SECRET: build-only-meta-secret-placeholder
          META_VERIFY_TOKEN: build-only-verify-token
          META_OAUTH_STATE_SECRET: build-only-oauth-state-secret-placeholder
          META_GRAPH_API_VERSION: v26.0
          TOKEN_ENCRYPTION_KEY: build-only-token-encryption-key-32-characters-minimum
        run: npm run build
